[project]
name = "cierre-backend"
version = "0.1.0"
description = "Servicio contable Wallbit: API y workers del cierre de mes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.33",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.32,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13,<1.15",
    "celery>=5.4,<5.5",
    "prometheus-client>=0.20,<0.22",
    "structlog>=24.4,<25",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.112,<7",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<0.9",
    "mypy>=1.11,<1.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Celery y kombu no publican tipos: se relaja mypy solo en el borde de mensajería.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker", "app.modules.*.tasks"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_unused_ignores = false
