<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Adhesión al servicio contable</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.c{--bg:#F6F7F9;--surface:#FFFFFF;--surface-muted:#F0F2F5;--border:#DDE1E7;--border-input:#8A93A2;--ink:#131821;--ink-muted:#586171;--ink-subtle:#646C7B;--primary:#1F5FD6;--primary-ink:#FFFFFF;--primary-tint:#E8EFFC;font-family:Geist,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:22px;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
.c.dark{--bg:#0E1117;--surface:#161A22;--surface-muted:#1C212B;--border:#2A303B;--border-input:#667186;--ink:#E7EAF0;--ink-muted:#9AA3B2;--ink-subtle:#7F8898;--primary:#6E9BF3;--primary-ink:#0E1117;--primary-tint:#1B2A47;color-scheme:dark}
.c *{box-sizing:border-box}
.c :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.cap{font-size:13px;line-height:18px}
.field{display:grid;gap:4px}
.field span{font-size:13px;color:var(--ink-muted)}
.field input{min-height:48px;border-radius:12px;border:1px solid var(--border-input);background:var(--surface);color:var(--ink);padding:0 14px;font-family:inherit;font-size:15px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; padding: 16px 12px 8px;">
    <a href="AppOferta.dc.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; color: var(--primary); text-decoration: none; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Volver</a>
    <span class="cap muted" style="margin-left: auto; padding-right: 8px;">Paso 1 de 2</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 20px;">
    <div style="display: grid; gap: 6px;">
      <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em;">Confirmá tus datos</h1>
      <p style="margin: 0;" class="muted">Los precargamos con lo que ya sabemos de tu cuenta Wallbit.</p>
    </div>

    <label class="field"><span>Nombre y apellido</span><input type="text" value="Martina Ríos"></label>
    <label class="field"><span>CUIT</span><input class="mono" type="text" value="27-3•••••12-4"></label>
    <label class="field"><span>Actividad</span><input type="text" value="Diseño UX para clientes del exterior"></label>
    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-muted);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01"></path><path d="M11 12h1v4h1"></path></svg>
      <span class="cap">Tu régimen y tu categoría de monotributo los leemos de ARCA en el próximo paso.</span>
    </div>

    <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; border: 1px solid var(--primary); background: var(--primary-tint); cursor: pointer;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--primary); flex: none;">
      <span class="cap" style="color: var(--ink);">Autorizo a Wallbit y a su contador matriculado a ver mis movimientos y mis comprobantes de ARCA para calcular mis impuestos. Puedo revocarlo cuando quiera desde Ajustes.</span>
    </label>

    <div style="margin-top: auto; display: grid; gap: 10px;">
      <a href="AppArca.dc.html" style="display: grid; place-items: center; min-height: 52px; border-radius: 14px; background: var(--primary); color: var(--primary-ink); font-size: 16px; font-weight: 600; text-decoration: none;">Continuar</a>
      <span class="cap muted" style="text-align: center;">Términos del servicio · Política de datos</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'c dark' : 'c' };
  }
}
</script>
</body>
</html>
