# Hooks locales (ver docs/TESTING.md, "Dónde corre cada cosa").
# Instalación: make hooks
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/hifi/
      - id: end-of-file-fixer
        exclude: ^docs/hifi/
      - id: check-yaml
      - id: check-json
        exclude: ^web/tsconfig\.json$ # admite comentarios
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Ruff y mypy usan las versiones fijadas en backend/uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
      - id: tsc-web
        name: tsc (web)
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
      - id: pytest-backend
        name: pytest (backend)
        entry: uv run --directory backend pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@19.5.0"]
